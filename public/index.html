<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Activity</title>
    <script type="module" src="/dist/portfolio-activity.js"></script>
    <!-- TODO: include fonts in build then remove from here -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>portfolio-activity</h1>

    <!--
    Render sample code in a textarea, then render the result of that code below. A simple interactive editor and documentation of CSS vars.
    -->
    <textarea id="code" rows="12" cols="60" autocomplete="off">
      <style>
        portfolio-activity {
          /*--portfolio-activity-font-serif: serif;*/
          /*--portfolio-activity-font-mono: monospace;*/
          /*--portfolio-activity-color: currentColor;*/
          /*--portfolio-activity-color-success: #00ff93;*/
          /*--portfolio-activity-color-active: #009fff;*/
          /*--portfolio-activity-border-color: currentColor;*/
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.5rem;
        }
      </style>
      <portfolio-activity count="6" displayName="Christian"></portfolio-activity>
    </textarea>
    <button id="reset" type="button">Reset</button>
    <div id="preview"></div>
    <script type="module">
      const code = document.getElementById("code");
      const preview = document.getElementById("preview");
      const reset = document.getElementById("reset");
      const defaultCode = code.value;
      let timer;
      const render = () => {
        preview.innerHTML = code.value;
      };
      code.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(render, 400);
      });
      reset.addEventListener("click", () => {
        code.value = defaultCode;
        render();
      });
      render();
    </script>

    <p><a href="/docs">API docs</a></p>
  </body>
</html>
