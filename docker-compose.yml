services:
  pi-activity:
    build: .
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./public:/app/public
    restart: unless-stopped

  dev:
    build: .
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '8000:8000'
