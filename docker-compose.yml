services:
  app:
    build: .
    cap_drop:
      - ALL
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PORTFOLIO_ACTIVITY_CACHE_SECONDS=0
    volumes:
      - ./public:/app/public
      - public-dist:/app/public/dist
    restart: unless-stopped

  dev:
    build: .
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - public-dist:/app/public/dist
    ports:
      - '8000:8000'

volumes:
  public-dist:
